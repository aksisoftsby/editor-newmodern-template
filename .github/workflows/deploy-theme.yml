name: Deploy Theme

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload Theme
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          source: "themes/wpeditor/*"
          target: "/var/www/html/edi/newwordpress/wp-content/themes/wpeditor/"
          # Archive keeps the "themes/" prefix, so strip 1 leading path
          # element to avoid nesting wpeditor inside itself on the VPS.
          strip_components: 1
          # Re-uploads must replace existing files.
          overwrite: true
